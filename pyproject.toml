[project]
name = "commcare-sync"
version = "0.1.0"
description = "CommCare Sync simplifies the management of your CommCare data pipeline"
readme = "README.md"
requires-python = "~=3.10.0"  # TODO: ">=3.10,<3.15"
dependencies = [
    "Django",
    "django-allauth",
    "psycopg2-binary",
    "djangorestframework",
    "coreapi",  # DRF schemas and docs
    "django-anymail[mailgun]",  # email services
    "celery-progress",
    "celery",
    "celery[redis]",
    "django-reversion==3.0.8",
    "commcare-export~=1.8",
    "pyopenssl>=20.0.1",  # here to force upgrades of commcare-export dependencies
]

[project.optional-dependencies]
prod = [
    "gunicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip-tools",
    "fabric",
]

[tool.uv.sources]
