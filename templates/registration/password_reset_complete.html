{% extends "registration/base.html" %}
{% load i18n %}

{% block content %}
  <h1 class="h4">{% trans "Change Password" %}</h1>
  <p>{% trans "Your password has been changed." %}</p>
  <p>
    {% url 'login' as login_url %}
    {% blocktrans %}
      You can now <a href="{{ login_url }}">login</a> with your new password.
    {% endblocktrans %}
  </p>
{% endblock %}
