{% extends "web/app/app_base.html" %}
{% load i18n static %}
{% block app %}
  <section class="py-4 app-card">
    <h1 class="h2">{% trans "Create Export Configuration" %}</h1>
    <form method="post" enctype="multipart/form-data" id="export-config-form">
      {% include 'exports/partials/export_form.html' %}
      {% include 'schedules/partials/schedule_form.html' %}
      <div class="d-flex gap-2">
        <div>
          <button class="btn btn-primary" type="submit">
            {% trans 'Create' %}
          </button>
        </div>
      </div>
    </form>
  </section>
{% endblock app %}
