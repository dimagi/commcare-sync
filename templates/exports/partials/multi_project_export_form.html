{% load i18n %}
{% csrf_token %}
{{ config_form.non_field_errors }}
<div class="mb-3">
  <label for="{{ config_form.name.id_for_label }}" class="form-label"
    >{% trans "Name" %}</label
  >
  <div>{{ config_form.name }}</div>
  {{ config_form.name.errors }}
</div>
<div class="mb-3">
  <label for="{{ config_form.projects.id_for_label }}" class="form-label"
    >{% trans "Projects" %}</label
  >
  <div
    onchange="if (event.target.name === 'projects') { htmx.trigger('#id_config_file_select', 'refresh') }"
  >
    {{ config_form.projects }}
  </div>
  {{ config_form.projects.errors }}
</div>
{% include 'exports/partials/export_form_shared.html' %}
