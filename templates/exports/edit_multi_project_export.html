{% extends "web/app/app_base.html" %}
{% load i18n static %}
{% block app %}
<section class="section app-card">
  <h1 class="title">{% blocktrans with name=export.name %}Edit {{ name }}{% endblocktrans %}</h1>
  <form
      method="post"
      enctype="multipart/form-data"
      id="export-config-form"
      data-fetch-config-url="{% url 'exports:fetch_config_files' %}"
  >
    {% include 'exports/partials/multi_project_export_form.html' %}
    <div class="field is-grouped">
      <div class="control">
        <input class="button is-primary" type="submit" value="{% trans 'Save' %}">
      </div>
    </div>
  </form>
</section>
<script src="{% static 'js/export-config-fetch.js' %}"></script>
{% endblock app %}
