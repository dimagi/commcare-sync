{% extends "web/base.html" %}
{% load static %}
{% block page_js %}
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document
        .querySelectorAll('[data-bs-toggle="tooltip"]')
        .forEach((el) => new bootstrap.Tooltip(el));
    });
  </script>
{% endblock %}
{% block body %}
  {% block notifications %}
  {% endblock %}
  <section class="py-4">
    <div class="container app-two-column" id="app-main">
      <div id="app-nav">
        {% block sidebar-nav %}
          {% include "web/components/app_nav.html" %}
        {% endblock %}
      </div>
      <div id="app-content">
        {% block app %}
        {% endblock %}
      </div>
    </div>
  </section>
{% endblock %}
