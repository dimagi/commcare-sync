{% load i18n %}
<section class="py-4 app-card" x-data="{ running: false, forceSync: false }">
  <h1 class="h2">{% trans "Run History" %}</h1>
  <div class="d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <button
        class="btn btn-primary btn-sm rounded-pill"
        id="run-now-button"
        @click="running = true"
        :disabled="running"
      >
        <span class="me-2">
          <i class="fa fa-play"></i>
        </span>
        <span>{% trans "Run Now" %}</span>
      </button>
      {% if show_force_sync %}
        <label for="force-sync-checkbox" class="form-check-label mx-2">
          <input
            type="checkbox"
            class="form-check-input"
            id="force-sync-checkbox"
            x-model="forceSync"
          />
          {% trans "Force sync of all data" %}
        </label>
      {% endif %}
    </div>
    <div class="d-flex align-items-center gap-2">
      <label>{% trans "Filter" %}</label>
      {% if hide_skipped %}
        <a
          class="btn btn-outline-primary btn-sm rounded-pill mx-2"
          href="?hide_skipped=n"
        >
          <span>{% trans "Show Queued and Skipped Items" %}</span>
        </a>
      {% else %}
        <a
          class="btn btn-outline-primary btn-sm rounded-pill mx-2"
          href="?hide_skipped=y"
        >
          <span>{% trans "Hide Queued and Skipped Items" %}</span>
        </a>
      {% endif %}
    </div>
  </div>
  <div id="run-status-progress" class="my-2" x-show="running" x-cloak>
    <div class="progress-wrapper">
      <div class="progress" style="height: 20px;">
        <div
          id="progress-bar"
          class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
          role="progressbar"
          style="width: 0%"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
    </div>
    <div id="progress-bar-message" class="text-muted">
      {% trans "Waiting for task to start..." %}
    </div>
  </div>
  {% include table_include_path %}
</section>
