{% load team_tags %}
{% if request.team and request.user|is_admin_of:request.team %}
  <li>
    <a
      class="icon-link{% if active_tab == 'team-admin' %} active{% endif %}"
      href="{% url 'web:team_admin' request.team.slug %}"
    >
      <i class="fa fa-gear"></i><span class="d-none d-lg-inline ms-2">Admin</span>
    </a>
  </li>
{% endif %}
