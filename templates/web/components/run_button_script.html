{% load i18n %}
{% comment %}
Shared JavaScript for run button functionality.

Parameters:
  - run_url_name: Django URL name (e.g., 'exports:run_export')
  - object_id: ID of the object to run
  - include_start_over: Whether to include startOver checkbox value (default: false)
{% endcomment %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const runButton = document.getElementById('run-now-button');
  const progressBar = document.getElementById('progress-bar');
  const progressMessage = document.getElementById('progress-bar-message');

  if (!runButton) return;

  const DEFAULT_POLL_CONFIG = {
    minInterval: 2000,  // 00:00:02
    maxInterval: 10000,  // 00:00:10
    maxElapsed: 30 * 60000,  // 00:30:00
  };
  const MAX_RETRIES = 2;

  // Color per terminal status, following the run-history badges in
  // apps/exports/templatetags/exports_tags.py. Wording is never decided
  // here: it comes from the endpoint's `label`.
  const TERMINAL_COLOURS = {
    completed: 'bg-success',
    failed: 'bg-danger',
    timeout: 'bg-warning',
    multiple: 'bg-warning',
    skipped: 'bg-secondary',
  };
  // Every color the bar can carry, including the bg-primary baked into
  // its markup. With four outcome colors in play, a partial reset would
  // leave the rendering to stylesheet order rather than to the status.
  const BAR_COLOURS = [
    'bg-primary', 'bg-success', 'bg-danger', 'bg-warning', 'bg-secondary',
  ];

  const ALREADY_RUNNING = '{% trans "Already running" %}';
  const RUN_GONE = '{% trans "This run no longer exists" %}';
  const SESSION_EXPIRED = '{% trans "Session expired — refresh the page" %}';
  const START_FAILED = '{% trans "Could not start the run" %}';
  const POLL_FAILED = '{% trans "Lost track of this run — refresh the page" %}';
  const STILL_RUNNING = '{% trans "Still running — refresh the page to check" %}';

  function alpineState() {
    const section = runButton.closest('section');
    return section && Alpine.$data(section) ? Alpine.$data(section) : null;
  }

  // Alpine owns the button (:disabled="running") and the progress region
  // (x-show="running"), so clearing `running` is what re-enables the
  // button -- and it unmounts the progress message along with it.
  // Anything the user still needs to read goes to `notice`, which is
  // rendered outside that region.
  function release(notice) {
    const state = alpineState();
    if (state) {
      state.notice = notice || '';
      state.running = false;
    }
  }

  function finish(status, label) {
    progressBar.style.width = '100%';
    progressBar.classList.add(TERMINAL_COLOURS[status] || 'bg-secondary');
    progressMessage.textContent = label;
    setTimeout(() => {
      htmx.trigger('#run-table', 'refresh');
      release();
    }, 1000);
  }

  // An expired session answers with a redirect to the login page, which
  // arrives as response.ok with an HTML body. Without this check .json()
  // throws and the failure is indistinguishable from a network blip.
  function isJson(response) {
    const contentType = response.headers.get('Content-Type') || '';
    return !response.redirected && contentType.includes('application/json');
  }

  function startPolling(pollUrl) {
    // Overridable so the ceiling is testable: as consts in this closure
    // the three numbers are unreachable from Playwright, and the test
    // would have to wait out the real 30 minutes.
    const config = {
      ...DEFAULT_POLL_CONFIG,
      ...(window.RUN_BUTTON_POLL_CONFIG || {}),
    };
    let elapsed = 0;
    let lastTick = Date.now();
    let lastRequest = 0;
    let retries = 0;
    let timer = null;
    // A resume can start a second tick while the first one's fetch is
    // still in flight. Whichever finishes first wins, and the loser must
    // not be able to re-arm the timer after the poll has been torn down.
    let stopped = false;

    // Check about ten times per elapsed-time scale. The interval slides
    // up, never faster than minInterval, never slower than maxInterval.
    function interval() {
      return Math.min(
        config.maxInterval,
        Math.max(config.minInterval, elapsed / 10),
      );
    }

    function teardown() {
      stopped = true;
      clearTimeout(timer);
      document.removeEventListener('visibilitychange', onVisibilityChange);
    }

    function stop(notice) {
      teardown();
      release(notice);
    }

    function schedule() {
      if (stopped) return;
      clearTimeout(timer);
      if (document.hidden) return;
      timer = setTimeout(tick, interval());
    }

    function onVisibilityChange() {
      if (document.hidden) {
        clearTimeout(timer);
      } else {
        // Time spent hidden doesn't count -- a background tab is not
        // abandoned -- and poll at once rather than showing stale state
        // up to maxInterval (but only poll if an interval has passed
        // since the last request, so that switching tabs quickly
        // doesn't issue a flurry of requests).
        lastTick = Date.now();
        if (Date.now() - lastRequest >= config.minInterval) {
          tick();
        } else {
          schedule();
        }
      }
    }

    function tick() {
      if (stopped) return;
      const now = Date.now();
      elapsed += now - lastTick;
      lastTick = now;
      if (elapsed >= config.maxElapsed) {
        stop(STILL_RUNNING);
        return;
      }
      lastRequest = now;
      fetch(pollUrl, { credentials: 'same-origin' })
        .then(response => {
          if (response.status === 404) {
            stop(RUN_GONE);
            return null;
          }
          if (response.ok && !isJson(response)) {
            stop(SESSION_EXPIRED);
            return null;
          }
          if (!response.ok) throw new Error(`status ${response.status}`);
          return response.json();
        })
        .then(data => {
          if (data === null) return;
          // Reset on every success, so a long run cannot accumulate its
          // way to a false failure.
          retries = 0;
          if (data.complete) {
            teardown();
            finish(data.status, data.label);
          } else {
            progressMessage.textContent = data.label;
            schedule();
          }
        })
        .catch(error => {
          retries += 1;
          if (retries > MAX_RETRIES) {
            console.error('Gave up polling the run:', error);
            stop(POLL_FAILED);
          } else {
            schedule();
          }
        });
    }

    document.addEventListener('visibilitychange', onVisibilityChange);
    tick();
  }

  runButton.addEventListener('click', function() {
    {% if include_start_over %}
    const startOver = document.getElementById('start-over-checkbox')?.checked || false;
    {% endif %}

    const csrfHeaders = JSON.parse(document.body.getAttribute('hx-headers') || '{}');
    fetch('{% url run_url_name object_id %}', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        ...csrfHeaders,
      },
      body: JSON.stringify({% if include_start_over %}{ startOver: startOver }{% else %}{}{% endif %}),
    })
    .then(response => {
      if (response.status === 409) {
        // Not an error: the run that blocked this click is the one the
        // user needs to see, so refresh the table as a finished run does.
        htmx.trigger('#run-table', 'refresh');
        release(ALREADY_RUNNING);
        return null;
      }
      if (response.ok && !isJson(response)) {
        release(SESSION_EXPIRED);
        return null;
      }
      if (!response.ok) {
        release(START_FAILED);
        return null;
      }
      return response.json();
    })
    .then(data => {
      if (data === null) return;
      progressBar.classList.remove(...BAR_COLOURS);
      progressBar.style.width = '0%';
      // The first poll is immediate: a run that finishes in under a
      // second should not sit behind "Waiting for the run to start...".
      startPolling(data.poll_url);
    })
    .catch(error => {
      console.error('Failed to start the run:', error);
      release(START_FAILED);
    });
  });
});
</script>
