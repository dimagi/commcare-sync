{% load i18n %}
{% comment %}
Shared JavaScript for run button functionality.

Parameters:
  - run_url_name: Django URL name (e.g., 'exports:run_export')
  - object_id: ID of the object to run
  - include_start_over: Whether to include startOver checkbox value (default: false)
{% endcomment %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  const runButton = document.getElementById('run-now-button');
  const progressBar = document.getElementById('progress-bar');
  const progressMessage = document.getElementById('progress-bar-message');

  if (!runButton) return;

  function finish(success) {
    progressBar.style.width = '100%';
    progressBar.classList.add(success ? 'bg-success' : 'bg-danger');
    progressMessage.textContent = success
      ? '{% trans "Complete!" %}'
      : '{% trans "Failed!" %}';
    setTimeout(() => {
      htmx.trigger('#run-table', 'refresh');
      runButton.disabled = false;

      // Reset Alpine state
      const section = runButton.closest('section');
      if (section && Alpine.$data(section)) {
        Alpine.$data(section).running = false;
      }
    }, 1000);
  }

  function poll(taskId) {
    const statusUrl =
      '{% url "web:task_status" "TASK_ID" %}'.replace('TASK_ID', taskId);
    fetch(statusUrl, { credentials: 'same-origin' })
      .then(response => response.json())
      .then(data => {
        if (!data.complete) {
          progressMessage.textContent = '{% trans "Running..." %}';
          setTimeout(() => poll(taskId), 2000);
        } else {
          const failed = !data.success
            || (data.result && data.result.status === 'failed');
          finish(!failed);
        }
      })
      .catch(() => finish(false));
  }

  runButton.addEventListener('click', function() {
    {% if include_start_over %}
    const startOver = document.getElementById('start-over-checkbox')?.checked || false;
    {% endif %}

    const csrfHeaders = JSON.parse(document.body.getAttribute('hx-headers') || '{}');
    fetch('{% url run_url_name object_id %}', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        ...csrfHeaders,
      },
      body: JSON.stringify({% if include_start_over %}{ startOver: startOver }{% else %}{}{% endif %}),
    })
    .then(response => response.text())
    .then(taskId => {
      progressBar.classList.remove('bg-danger', 'bg-success');
      progressBar.style.width = '0%';
      poll(taskId);
    })
    .catch(error => {
      console.error('Failed to start task:', error);
      runButton.disabled = false;

      const section = runButton.closest('section');
      if (section && Alpine.$data(section)) {
        Alpine.$data(section).running = false;
      }
    });
  });
});
</script>
