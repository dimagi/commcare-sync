{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
  <section class="py-4 app-card">
    <h1 class="h2">{% trans "Delete Database" %}</h1>
    <p>
      {% blocktrans with name=db.name %}
        Are you sure you want to delete the database connection
        <strong>{{ name }}</strong>?
      {% endblocktrans %}
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <div>
          <input
            class="btn btn-danger"
            type="submit"
            value="{% trans 'Delete' %}"
          />
        </div>
        <div>
          <a class="btn btn-secondary" href="{% url 'db:databases' %}">
            {% trans "Cancel" %}
          </a>
        </div>
      </div>
    </form>
  </section>
{% endblock app %}
