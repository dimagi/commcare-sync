{% extends "web/base.html" %}
{% load static i18n %}

{% block body %}
<div id="fullpage-form-wrapper">
    <div id="fullpage-form">
        <h1 class="h4">{% trans "Sign in" %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
              <label class="form-label">{% trans "Email" %}</label>
              <div>
                {{ form.login }}
              </div>
              {{ form.login.errors }}
            </div>
            <div class="mb-3">
              <label class="form-label">{% trans "Password" %}</label>
              <div>
                {{ form.password }}
              </div>
              {{ form.password.errors }}
            </div>
            <input class="btn btn-primary w-100" type="submit" value="{% trans 'Sign in' %}">



            <hr>
            <div class="mb-3 text-center">
                <a class="muted-link" href="{% url 'account_reset_password' %}">
                    {% trans "Forgot password?" %}
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
