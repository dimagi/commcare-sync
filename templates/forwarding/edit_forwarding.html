{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
  <section class="py-4 app-card">
    <h1 class="h2">
      {% blocktrans with name=forwarder.name %}Edit {{ name }}{% endblocktrans %}
    </h1>
    <form method="post" enctype="multipart/form-data">
      {% include 'forwarding/partials/forwarding_form.html' %}
      {% include 'schedules/partials/schedule_form.html' %}
      <div class="d-flex gap-2">
        <div>
          <input
            class="btn btn-primary"
            type="submit"
            value="{% trans 'Save' %}"
          />
        </div>
      </div>
    </form>
  </section>
{% endblock app %}
