{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
<section class="section app-card">
  <h1 class="title">{% blocktrans with name=forwarder.name %}Edit {{ name }}{% endblocktrans %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% include 'forwarding/partials/forwarding_form.html' %}
    {% include 'schedules/partials/schedule_form.html' %}
    <div class="field is-grouped">
      <div class="control">
        <input class="button is-primary" type="submit" value="{% trans 'Save' %}">
      </div>
    </div>
  </form>
</section>
{% endblock app %}
