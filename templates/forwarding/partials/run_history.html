{% load i18n %}
<section class="section app-card">
  <h1 class="title">{% trans "Run History" %}</h1>
  <div class="level">
    <div class="level-left">
      <button class="button is-primary is-rounded is-small" id="run-forwarding-button">
        <span class="icon">
          <i class="fa fa-play"></i>
        </span>
        <span>{% trans "Run Now" %}</span>
      </button>
    </div>
    <div class="level-right">
      <label>{% trans "Filter" %}</label>
      {% if hide_skipped %}
        <a class="button is-primary is-rounded is-outlined is-small mx-2" href="?hide_skipped=n">
          <span>{% trans "Show Queued and Skipped Items" %}</span>
        </a>
      {% else %}
      <a class="button is-primary is-rounded is-outlined is-small mx-2" href="?hide_skipped=y">
        <span>{% trans "Hide Queued and Skipped Items" %}</span>
      </a>
      {% endif %}
    </div>
  </div>
  <div id="forwarding-status-progress" class="progress-bar-demo my-2" style="display: none;">
    <div class='progress-wrapper'>
      <progress id="progress-bar" class="progress is-small is-primary" max="100"></progress>
    </div>
    <div id="progress-bar-message" class="has-text-grey">{% trans "Waiting for task to start..." %}</div>
  </div>
{% include 'forwarding/partials/run_history_table.html' %}
</section>
