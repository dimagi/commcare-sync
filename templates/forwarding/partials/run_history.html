{% load i18n %}
<section class="py-4 app-card">
  <h1 class="h2">{% trans "Run History" %}</h1>
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <button class="btn btn-primary btn-sm rounded-pill" id="run-forwarding-button">
        <span class="me-2">
          <i class="fa fa-play"></i>
        </span>
        <span>{% trans "Run Now" %}</span>
      </button>
    </div>
    <div class="d-flex align-items-center gap-2">
      <label>{% trans "Filter" %}</label>
      {% if hide_skipped %}
        <a class="btn btn-outline-primary btn-sm rounded-pill mx-2" href="?hide_skipped=n">
          <span>{% trans "Show Queued and Skipped Items" %}</span>
        </a>
      {% else %}
      <a class="btn btn-outline-primary btn-sm rounded-pill mx-2" href="?hide_skipped=y">
        <span>{% trans "Hide Queued and Skipped Items" %}</span>
      </a>
      {% endif %}
    </div>
  </div>
  <div id="forwarding-status-progress" class="progress-bar-demo my-2" style="display: none;">
    <div class='progress-wrapper'>
      <div class="progress" style="height: 20px;">
        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>
    <div id="progress-bar-message" class="text-muted">{% trans "Waiting for task to start..." %}</div>
  </div>
{% include 'forwarding/partials/run_history_table.html' %}
</section>
