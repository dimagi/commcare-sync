{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
  <section class="py-4 app-card">
    <h1 class="h2">{% trans "Edit Account" %}</h1>
    <form method="post" enctype="multipart/form-data">
      {% include 'commcare/partials/account_form.html' %}
      <div class="d-flex gap-2">
        <div>
          <button class="btn btn-primary" type="submit">
            {% trans 'Save Account' %}
          </button>
        </div>
      </div>
    </form>
  </section>
{% endblock app %}
