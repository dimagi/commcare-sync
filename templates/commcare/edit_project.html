{% extends "web/app/app_base.html" %}
{% load i18n %}
{% block app %}
<section class="section app-card">
  <h1 class="title">{% blocktrans with domain=project.domain %}Edit {{ domain }}{% endblocktrans %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% include 'commcare/partials/project_form.html' %}
    <div class="field is-grouped">
        <div class="control">
            <input class="button is-primary" type="submit" value="{% trans 'Save' %}">
        </div>
    </div>
  </form>
</section>
{% endblock app %}
