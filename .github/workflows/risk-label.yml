name: Risk label

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled]

jobs:

  risk-label:
    name: Risk label
    runs-on: ubuntu-24.04
    steps:
      - env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          count=$(jq '[.[] | select(. == "Risk: Low" or . == "Risk: High")] | length' <<<"$LABELS")
          if [ "$count" -ne 1 ]; then
            echo "::error::Apply exactly one of 'Risk: Low' or 'Risk: High' (found $count)."
            exit 1
          fi
