name: CI

on:
  pull_request:

jobs:

  lint:
    name: Linter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.14 ruff check

  typecheck:
    name: Type Checker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.14 mypy apps/ commcare_sync/ *.py

  test:
    name: Django Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cp commcare_sync/{settings_github.py,settings_local.py}
      - run: uv run --python ${{ matrix.python-version }} playwright install chromium
      - run: uv run --python ${{ matrix.python-version }} pytest
