name: CI

on:
  push:
  pull_request:

jobs:

  lint:
    name: Linter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.14 ruff check

  typecheck:
    name: Type Checker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.14 mypy apps/ commcare_sync/ *.py

  test:
    name: Django Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: psql -c 'create database commcare_sync_test;' -U postgres -h localhost
      - run: cp commcare_sync/{settings_travis.py,settings_local.py}
      - run: uv run --python ${{ matrix.python-version }} pytest
